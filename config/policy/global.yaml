quality_gates:
  min_coverage: 80
  typecheck: true
  lint: true
  tests: true
required_scans:
- secrets
- dependencies
reviewers:
  min_approvals: 1
  required_roles:
  - security
agent_authorisation:
  allowed_agents:
  - backend
  - frontend
  - qa
  - reviewer
ranges:
  quality_gates.min_coverage:
    min: 70
    max: 100
